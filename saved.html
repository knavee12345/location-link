<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved Locations</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f5f4;
      font-family: Arial, sans-serif;
      color: #1d2a28;
    }
    .card {
      width: min(90vw, 620px);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
      padding: 28px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }
    .status {
      color: #445a56;
      margin-bottom: 16px;
    }
    .entry {
      border: 1px solid #dfe6e3;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #fafcfb;
    }
    .entry strong {
      display: block;
      margin-bottom: 6px;
    }
    a {
      color: #1f4d46;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Saved Locations</h1>
    <div id="status" class="status">Loading saved entries...</div>
    <div id="entries"></div>
    <p><a href="tracker.html">Back to tracker</a></p>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const entriesEl = document.getElementById('entries');

    async function loadEntries() {
      try {
        const response = await fetch('/api/location');
        const data = await response.json();

        if (!response.ok || !Array.isArray(data) || data.length === 0) {
          statusEl.textContent = 'No saved entries yet.';
          return;
        }

        statusEl.textContent = 'Latest saved entries:';
        entriesEl.innerHTML = data.map((entry) => `
          <div class="entry">
            <strong>${new Date(entry.timestamp).toLocaleString()}</strong>
            <div>Latitude: ${entry.latitude}</div>
            <div>Longitude: ${entry.longitude}</div>
            <div>Accuracy: ${entry.accuracy} meters</div>
          </div>
        `).join('');
      } catch (error) {
        statusEl.textContent = 'Unable to load saved entries.';
      }
    }

    loadEntries();
  </script>
</body>
</html>
